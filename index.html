<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D9145A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boto Na, Bes!">
<title>Boto Na, Bes!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2317121F'/%3E%3Cpath d='M3 5h4.6L12 14.5 16.4 5H21l-9 15z' fill='%23FF5A91'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2317121F'/%3E%3Cpath d='M3 5h4.6L12 14.5 16.4 5H21l-9 15z' fill='%23FF5A91'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>

/* Layout: one phone-width column. Top bar, a stack of panels per screen, a sticky action dock for the host. */
:root{
  --bg:#F4F1F8; --surface:#FFFFFF; --ink:#17121F; --muted:#665E74; --line:#DDD6E8;
  --accent:#D9145A; --accent-ink:#FFFFFF; --card:#17121F; --card-ink:#FFFFFF;
  --ok:#17803F; --warn:#9A5B00; --warn-bg:#FFF1D6;
  --f-display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14101B; --surface:#1F1A29; --ink:#F3EFFA; --muted:#A79DB8; --line:#372F48;
    --accent:#FF5A91; --accent-ink:#1A0710; --card:#2B2340; --card-ink:#FFFFFF;
    --ok:#4CD487; --warn:#F2B34C; --warn-bg:#3A2D12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14101B; --surface:#1F1A29; --ink:#F3EFFA; --muted:#A79DB8; --line:#372F48;
  --accent:#FF5A91; --accent-ink:#1A0710; --card:#2B2340; --card-ink:#FFFFFF;
  --ok:#4CD487; --warn:#F2B34C; --warn-bg:#3A2D12; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
.shell{max-width:520px;margin:0 auto;padding-block:10px 24px;display:flex;flex-direction:column;gap:16px;min-height:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.center{text-align:center}
.small{font-size:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;font:800 17px var(--f-display);letter-spacing:.02em}
.top-right{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;min-height:34px}
button.chip{cursor:pointer}

.hero h1{font:800 clamp(52px,17vw,84px)/.86 var(--f-display);letter-spacing:-.02em;text-transform:uppercase}
.hero h1 span{display:block;color:var(--accent)}
.hero p{margin-top:14px;font-size:18px;max-width:30ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font:800 20px var(--f-display)}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 14px;font-size:17px;font-weight:600}
.field:focus{border-color:var(--accent);outline:none}
.codefield{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-family:var(--f-display);font-size:22px}
.row{display:flex;gap:10px;align-items:stretch}
.row>*{min-width:0}
.row .field{flex:1}

.btn{appearance:none;border:0;border-radius:14px;min-height:52px;padding:0 20px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.btn.text{background:none;color:var(--muted);min-height:44px;padding:0 10px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.err{color:var(--accent);font-weight:600;font-size:14px;min-height:0}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600}

details.rules{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 16px}
details.rules summary{min-height:52px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details.rules div{padding-bottom:14px;display:flex;flex-direction:column;gap:8px;font-size:15px}

.roomcode{font:800 clamp(44px,15vw,64px)/1 var(--f-display);letter-spacing:.14em;text-align:center;user-select:all;padding:6px 0 6px .14em}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pl{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px 6px 8px;background:var(--bg);border:1px solid var(--line);font-weight:600}
.dot{width:20px;height:20px;border-radius:50%;flex:none}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.decks{display:flex;flex-wrap:wrap;gap:8px}
.deck{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;min-height:40px}
.deck i{width:12px;height:12px;border-radius:3px;display:block}
.deck[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.deck[aria-pressed="false"]{opacity:.55}
.deck[disabled]{cursor:default}
.seg{display:grid;gap:8px}
.opt{appearance:none;cursor:pointer;text-align:left;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:10px 14px;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.opt b{font-size:16px}.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.opt[disabled]{cursor:default}

.score{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.sc{flex:none;display:flex;align-items:center;gap:7px;border-radius:12px;padding:6px 12px 6px 7px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.sc b{font:800 18px var(--f-display);font-variant-numeric:tabular-nums}
.round{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.round b{font:800 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase}

.qcard{background:var(--card);color:var(--card-ink);border-radius:22px;padding:22px 20px 14px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;border:1px solid var(--line)}
.qtext{font:800 clamp(23px,6.4vw,30px)/1.14 var(--f-display);text-wrap:balance}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.qcard.small{min-height:0;padding:16px 16px 12px}
.qcard.small .qtext{font-size:19px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{appearance:none;border:0;cursor:pointer;border-radius:16px;min-height:82px;padding:10px 12px;font:800 20px/1.1 var(--f-display);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;overflow-wrap:anywhere}
.tile small{font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;opacity:0}
.tile[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:3px}
.tile[aria-pressed="true"] small{opacity:.9}
.tile[disabled]{cursor:default}

.res{display:flex;flex-direction:column;gap:12px}
.rr{display:flex;flex-direction:column;gap:6px}
.rh{display:flex;align-items:center;gap:8px;font-weight:700}
.rh .n{flex:1;min-width:0;overflow-wrap:anywhere}
.rh .c{font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.track{height:18px;border-radius:9px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;border-radius:9px;width:0}
.anim .fill{transition:width .9s cubic-bezier(.2,.8,.2,1)}
.badge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:6px;padding:3px 7px}
.voters{display:flex;flex-wrap:wrap;gap:6px}
.vch{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px}
.verdict{font:800 20px/1.2 var(--f-display);text-wrap:balance}

.winner{font:800 clamp(40px,13vw,60px)/.95 var(--f-display);text-transform:uppercase;text-wrap:balance}
.dock{position:sticky;bottom:0;display:flex;flex-direction:column;gap:8px;padding:12px 0 8px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.wait{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;color:var(--muted);font-weight:600}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tabs .deck{flex:none}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.qlist li{padding:14px 0;border-top:1px solid var(--line);font-size:17px;font-weight:500;display:flex;gap:12px;align-items:flex-start}
.qlist li:first-child{border-top:0}
.qlist li i{width:10px;height:10px;border-radius:3px;margin-top:8px;flex:none}

#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.anim .fill,#toast{transition:none}}

html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh}
.off{opacity:.5}
.status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:block}
.status.bad i{background:var(--accent)}
</style>
</head>
<body>
<div class="shell">
  <header class="top" id="top"></header>
  <main id="app" style="display:flex;flex-direction:column;gap:16px"></main>
</div>

function topHtml(){
  var right = '';
  if(view === 'room'){
    right = '<button class="chip" data-act="copy" aria-label="Kopyahin ang room code">Room ' + esc(code) + '</button><button class="chip" data-act="leave">' + (armLeave ? 'Sigurado ka?' : 'Umalis') + '</button>';
  } else if(view === 'browse') right = '<button class="chip" data-act="back">Balik</button>';
  return '<div class="brand"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M1.5 3h6.2L12 14.2 16.3 3h6.2L15 21h-6z" fill="var(--accent)"/></svg>BOTO NA, BES!</div><div class="top-right">' + right + '</div>';
}
function homeHtml(){
  var savedHost = null; try{ var raw = lsGet('bnb_host'); if(raw){ savedHost = JSON.parse(raw); if(!savedHost || !savedHost.code || Date.now() - savedHost.t > 12 * 3600 * 1000) savedHost = null; } }catch(e){}
  var savedClient = ssGet('bnb_room');
  var h = '<section class="hero"><h1>Boto<span>na, bes!</span></h1><p>Ang party game na maglalabas ng totoong tea tungkol sa barkada mo. Bawat isa, sariling phone.</p></section>';
  var busy = status === 'connecting';
  h += '<section class="panel"><label class="label" for="name">Pangalan mo</label>'
    + '<input class="field" id="name" maxlength="14" autocomplete="nickname" placeholder="hal. Migs" value="' + esc(myName) + '">'
    + '<button class="btn block" data-act="create"' + (busy ? ' disabled' : '') + '>Gumawa ng room</button>'
    + '<p class="muted center small">o sumali sa room ng kaibigan</p>'
    + '<div class="row"><input class="field codefield" id="code" maxlength="5" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="CODE" aria-label="Room code">'
    + '<button class="btn alt" data-act="join"' + (busy ? ' disabled' : '') + '>Sumali</button></div>'
    + '<p class="err" id="err">' + esc(formErr) + '</p>';
  if(savedHost) h += '<button class="btn text" data-act="resumehost" data-code="' + esc(savedHost.code) + '">Ituloy ang room mo na ' + esc(savedHost.code) + '</button>';
  if(savedClient) h += '<button class="btn text" data-act="rejoin" data-code="' + esc(savedClient) + '">Bumalik sa room ' + esc(savedClient) + '</button>';
  h += '</section>';
  h += '<button class="btn alt block" data-act="browse">Tingnan ang ' + Q.length + ' na tanong</button>';
  h += '<details class="rules"><summary>Paano laruin</summary><div>'
    + '<p><b>1.</b> Isang tao ang gagawa ng room at ibibigay ang 5-letrang code. Ang iba ay maglalagay ng code sa sarili nilang phone.</p>'
    + '<p><b>2.</b> Lalabas ang tanong na "Sino...?" sa lahat ng phone. Sabay-sabay na pipili ng sagot ang bawat isa, pati ang nagtanong.</p>'
    + '<p><b>3.</b> Kapag nakaboto na ang lahat, ilalabas ang resulta. Hulaan kung sino ang bumoto sa iyo bago ibunyag ng host.</p>'
    + '<p><b>4.</b> Kung nakakuha ka ng kahit kalahati ng boto, sa iyo ang black card. Unang makaabot sa target, panalo.</p>'
    + '<p class="muted">Kailangang bukas ang phone ng host buong laro. Kung hindi makakonekta ang isang player, subukan ang parehong Wi-Fi.</p></div></details>';
  return h;
}
function browseHtml(){
  var d = DECKS[browseDeck];
  var h = '<h2 style="font:800 26px var(--f-display);margin:0">Lahat ng tanong</h2><div class="tabs" role="tablist">';
  DECKS.forEach(function(dk,i){ h += '<button class="deck" role="tab" data-act="tab" data-i="' + i + '" aria-pressed="' + (i === browseDeck) + '"><i style="background:' + dk.col + '"></i>' + esc(dk.name) + ' (' + dk.qs.length + ')</button>'; });
  h += '</div><section class="panel"><p class="muted small">' + esc(d.sub) + '</p><ul class="qlist">';
  d.qs.forEach(function(t){ h += '<li><i style="background:' + d.col + '"></i><span>' + esc(t) + '</span></li>'; });
  return h + '</ul></section>';
}
function scoreHtml(g, c){
  if(g.md === 'x') return '';
  return '<div class="score" aria-label="Score">' + g.od.map(function(pid){ return '<div class="sc"><span class="dot" style="background:' + colorOf(pid,c).bg + '"></span>' + esc(nameOf(pid,c)) + '<b>' + (g.sc[pid] || 0) + '</b></div>'; }).join('') + '</div>';
}
function qcard(g, small){
  var q = Q[g.q] || Q[0], d = DECKS[q.d];
  return '<div class="qcard' + (small ? ' small' : '') + '"><p class="qtext">' + esc(q.t) + '</p><div class="qfoot"><span>' + esc(d.name) + '</span><span>Boto Na, Bes!</span></div></div>';
}
function opt(m, cur, t, s, dis){ return '<button class="opt" data-act="mode" data-m="' + m + '" aria-pressed="' + (cur === m) + '"' + dis + '><b>' + t + '</b><span>' + s + '</span></button>'; }
function lobbyHtml(c, host){
  var g = c.g, pl = c.pl, onN = pl.filter(function(p){ return p.on; }).length;
  var h = '<section class="panel"><span class="label center">Room code</span><div class="roomcode">' + esc(code) + '</div>'
    + '<p class="muted center small">Ilagay ng barkada ang code na ito sa pahinang ito, sa sarili nilang phone.</p>'
    + '<button class="btn alt block" data-act="copy">Kopyahin ang code</button></section>';
  h += '<section class="panel"><h2>Mga player (' + onN + ')</h2><div class="players">';
  pl.forEach(function(p,i){
    h += '<span class="pl' + (p.on ? '' : ' off') + '"><span class="dot" style="background:' + COLORS[i % COLORS.length].bg + '"></span>' + esc(p.name)
      + (p.pid === myPid ? ' <span class="tag">ikaw</span>' : '') + (i === 0 ? ' <span class="tag">host</span>' : '') + (p.on ? '' : ' <span class="tag">offline</span>') + '</span>';
  });
  h += '</div></section>';
  var total = 0; Q.forEach(function(q){ if(g.dk.indexOf(q.d) > -1) total++; });
  var dis = host ? '' : ' disabled';
  h += '<section class="panel"><h2>Mga deck</h2><div class="decks">';
  DECKS.forEach(function(dk,i){ h += '<button class="deck" data-act="deck" data-i="' + i + '" aria-pressed="' + (g.dk.indexOf(i) > -1) + '"' + dis + '><i style="background:' + dk.col + '"></i>' + esc(dk.name) + ' (' + dk.qs.length + ')</button>'; });
  h += '</div><p class="muted small">' + total + ' na tanong ang sasali sa laro.</p></section>';
  h += '<section class="panel"><h2>Paraan ng laro</h2><div class="seg">'
    + opt('c', g.md, 'Classic', 'Black card sa nakakuha ng kalahati ng boto. Unang makaabot ng 6, panalo.', dis)
    + opt('m', g.md, 'Majority', 'Puntos para sa bawat bumoto sa nanalo. Unang makaabot ng 10, panalo.', dis)
    + opt('x', g.md, 'Chill', 'Walang score. Kwentuhan lang.', dis)
    + '<button class="opt" data-act="selfie" aria-pressed="' + !!g.sf + '"' + dis + '><b>Selfie mode</b><span>Pwedeng bumoto sa sarili.</span></button></div></section>';
  if(host) h += '<div class="dock"><button class="btn block" data-act="start"' + (onN < 3 ? ' disabled' : '') + '>' + (onN < 3 ? 'Kailangan ng 3 o higit pang players' : 'Simulan ang laro') + '</button></div>';
  else h += '<div class="wait">Hinihintay ang host na simulan ang laro...</div>';
  return h;
}
function voteHtml(c, host){
  var g = c.g, inGame = g.od.indexOf(myPid) > -1;
  var mine = host ? (votes[myPid] != null ? votes[myPid] : null) : (myVote && myVote.rd === g.rd ? myVote.v : null);
  var pending = g.od.filter(function(pid){ var p = plOf(c.pl,pid); return p && p.on && !g.voted[pid]; });
  var onN = g.od.filter(function(pid){ var p = plOf(c.pl,pid); return p && p.on; }).length;
  var h = '<div class="round"><b>Round ' + g.rd + '</b><span class="muted small">Nagtanong: ' + esc(nameOf(g.ak,c)) + (g.ak === myPid ? ' (ikaw)' : '') + '</span></div>' + scoreHtml(g,c) + qcard(g, false);
  if(inGame){
    h += '<p class="label">Sino ang sagot? Pumili ng isa. Pwede mo pang baguhin.</p><div class="tiles">';
    g.od.forEach(function(pid){
      if(pid === myPid && !g.sf) return;
      var col = colorOf(pid,c), p = plOf(c.pl,pid);
      h += '<button class="tile" data-act="vote" data-pid="' + esc(pid) + '" style="background:' + col.bg + ';color:' + col.fg + (p && !p.on ? ';opacity:.6' : '') + '" aria-pressed="' + (mine === pid) + '">' + esc(nameOf(pid,c)) + '<small>Boto mo</small></button>';
    });
    h += '</div>';
  } else h += '<div class="notice">Nagsimula na ang laro. Nanonood ka muna hanggang sa susunod na laro.</div>';
  h += '<p class="muted center small">' + (onN - pending.length) + ' sa ' + onN + ' ang nakaboto' + (pending.length && pending.length <= 3 ? '. Hinihintay: ' + pending.map(function(p){ return esc(nameOf(p,c)); }).join(', ') : '') + '</p>';
  if(host) h += '<div class="dock"><button class="btn alt block" data-act="reveal">Ipakita na ang resulta</button></div>';
  return h;
}
function revealHtml(c, host){
  var g = c.g, key = g.rd + ':r'; var first = animKey !== key; animKey = key;
  var ids = Object.keys(g.rs || {}).sort(function(a,b){ return g.rs[b] - g.rs[a]; });
  var zero = g.od.filter(function(p){ return !g.rs[p]; });
  var nm = function(list){ return list.map(function(w){ return esc(nameOf(w,c)); }).join(' at '); };
  var verdict;
  if(!g.wn.length) verdict = 'Walang nakakuha ng kalahati ng boto. Walang black card.';
  else if(g.md === 'm') verdict = nm(g.wn) + ' ang nanalo sa round. Puntos para sa mga bumoto sa kanya.';
  else if(g.md === 'x') verdict = nm(g.wn) + ' ang sagot ng barkada!';
  else verdict = nm(g.wn) + (g.wn.length > 1 ? ' ang magkahati sa black card.' : ' ang kumuha ng black card.');
  var h = '<div class="round"><b>Round ' + g.rd + '</b><span class="muted small">' + g.tv + ' ang boto</span></div>' + qcard(g, true) + '<p class="verdict">' + verdict + '</p>';
  var max = Math.max.apply(null, ids.map(function(i){ return g.rs[i]; }).concat([1]));
  h += '<section class="panel res' + (first ? ' anim' : '') + '">';
  ids.forEach(function(pid){
    var col = colorOf(pid,c), n = g.rs[pid], win = g.wn.indexOf(pid) > -1;
    h += '<div class="rr"><div class="rh"><span class="dot" style="background:' + col.bg + '"></span><span class="n">' + esc(nameOf(pid,c)) + '</span>' + (win ? '<span class="badge">' + (g.md === 'c' ? 'Black card' : 'Panalo') + '</span>' : '') + '<span class="c">' + n + '</span></div>'
      + '<div class="track"><div class="fill" data-w="' + Math.round(n / max * 100) + '" style="background:' + col.bg + ';width:' + (first ? 0 : Math.round(n / max * 100)) + '%"></div></div>';
    if(g.sh && g.vt){
      var vs = Object.keys(g.vt).filter(function(v){ return g.vt[v] === pid; });
      h += '<div class="voters">' + vs.map(function(v){ var vc = colorOf(v,c); return '<span class="vch" style="background:' + vc.bg + ';color:' + vc.fg + '">' + esc(nameOf(v,c)) + '</span>'; }).join('') + '</div>';
    }
    h += '</div>';
  });
  if(zero.length) h += '<p class="muted small">Walang boto: ' + nm(zero) + '</p>';
  h += '</section>';
  if(!g.sh) h += '<p class="muted center">Hulaan na! Para sa bawat boto na natanggap mo, hulaan kung sino ang bumoto sa iyo.</p>';
  h += scoreHtml(g,c);
  if(host) h += '<div class="dock">' + (!g.sh ? '<button class="btn alt block" data-act="show">Ibunyag kung sino ang bumoto</button>' : '') + '<button class="btn block" data-act="next">' + (g.fin ? 'Tingnan ang panalo' : 'Susunod na tanong') + '</button></div>';
  else h += '<div class="wait">Hinihintay ang host...</div>';
  return h;
}
function endHtml(c, host){
  var g = c.g, best = 0; g.od.forEach(function(p){ best = Math.max(best, g.sc[p] || 0); });
  var wn = g.od.filter(function(p){ return (g.sc[p] || 0) === best; });
  var h = '<p class="label center">Panalo</p><div class="winner center">' + wn.map(function(w){ return esc(nameOf(w,c)); }).join(' at ') + '</div>';
  if(wn.length > 1) h += '<p class="muted center">Tabla. Ang dealer ang magpapasya.</p>';
  h += '<section class="panel"><h2>Final score</h2>' + g.od.slice().sort(function(a,b){ return (g.sc[b] || 0) - (g.sc[a] || 0); }).map(function(p){
    return '<div class="rh"><span class="dot" style="background:' + colorOf(p,c).bg + '"></span><span class="n">' + esc(nameOf(p,c)) + '</span><span class="c">' + (g.sc[p] || 0) + '</span></div>';
  }).join('') + '</section>';
  return h + (host ? '<div class="dock"><button class="btn block" data-act="again">Maglaro ulit</button></div>' : '<div class="wait">Hinihintay ang host...</div>');
}
function roomHtml(){
  var c = cur(), host = role === 'host';
  if(!c || !c.g) return '<div class="wait">Kumokonekta sa room ' + esc(code) + '...</div>';
  var h = '';
  if(!host && status === 'lost') h += '<div class="notice">Nawala ang koneksyon sa host. Sinusubukang kumonekta ulit...</div>';
  var g = c.g;
  if(g.ph === 'lobby') h += lobbyHtml(c, host);
  else if(g.ph === 'vote') h += voteHtml(c, host);
  else if(g.ph === 'reveal') h += revealHtml(c, host);
  else h += endHtml(c, host);
  if(host && g.ph !== 'lobby') h += '<button class="btn text" data-act="tolobby">' + (armLeave === 2 ? 'Sigurado ka? Tapikin ulit para bumalik sa lobby' : 'Tapusin ang laro') + '</button>';
  return h;
}
function render(){
  top.innerHTML = topHtml();
  var keep = null;
  if(view === 'home'){ var n = document.getElementById('name'), cc = document.getElementById('code'); keep = {n:n && n.value, c:cc && cc.value}; }
  app.innerHTML = view === 'home' ? homeHtml() : view === 'browse' ? browseHtml() : roomHtml();
  if(keep){ var n2 = document.getElementById('name'), c2 = document.getElementById('code'); if(keep.n != null && n2) n2.value = keep.n; if(keep.c && c2) c2.value = keep.c; }
  var fills = app.querySelectorAll('.anim .fill[data-w]');
  if(fills.length) requestAnimationFrame(function(){ requestAnimationFrame(function(){ fills.forEach(function(f){ f.style.width = f.getAttribute('data-w') + '%'; }); }); });
}

/* ---------- events ---------- */
function readName(){
  var n = document.getElementById('name'), v = clean(n ? n.value : myName);
  if(!v){ formErr = 'Ilagay muna ang pangalan mo.'; render(); return null; }
  myName = v; lsSet('bnb_name', v); return v;
}
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t || t.disabled) return;
  var a = t.getAttribute('data-act'), host = role === 'host';
  if(a === 'create'){ if(readName()){ formErr = ''; hostTries = 0; startHost(false); } }
  else if(a === 'join'){
    if(!readName()) return;
    var c = (document.getElementById('code').value || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(c.length !== 5){ formErr = 'Ang room code ay 5 letra o numero.'; render(); return; }
    startClient(c);
  }
  else if(a === 'rejoin'){ if(readName()) startClient(t.getAttribute('data-code')); }
  else if(a === 'resumehost'){
    try{
      var sv = JSON.parse(lsGet('bnb_host'));
      code = sv.code; myPid = sv.pid; ssSet('bnb_pid', myPid); myName = sv.name || myName;
      players = sv.players.map(function(p){ return {pid:p.pid, name:p.name, on:p.pid === myPid}; });
      G = sv.G; votes = sv.votes || {}; hostTries = 0; startHost(true);
    }catch(err){ formErr = 'Hindi maibalik ang room.'; lsDel('bnb_host'); render(); }
  }
  else if(a === 'browse'){ view = 'browse'; render(); window.scrollTo(0,0); }
  else if(a === 'back'){ view = 'home'; render(); }
  else if(a === 'tab'){ browseDeck = +t.getAttribute('data-i'); render(); }
  else if(a === 'copy'){
    var done = function(){ toast('Nakopya ang code ' + code); };
    try{ navigator.clipboard.writeText(code).then(done, function(){ toast('Room code: ' + code); }); }catch(err){ toast('Room code: ' + code); }
  }
  else if(a === 'leave'){
    if(host && !armLeave){ armLeave = 1; render(); setTimeout(function(){ armLeave = 0; if(view === 'room') render(); }, 3500); }
    else leaveRoom();
  }
  else if(!host && a !== 'vote') return;
  else if(a === 'deck'){ var i = +t.getAttribute('data-i'), k = G.dk.indexOf(i); if(k > -1) G.dk.splice(k,1); else G.dk.push(i); G.dk.sort(function(x,y){ return x - y; }); broadcast(); }
  else if(a === 'mode'){ G.md = t.getAttribute('data-m'); G.tg = G.md === 'm' ? 10 : 6; broadcast(); }
  else if(a === 'selfie'){ G.sf = G.sf ? 0 : 1; broadcast(); }
  else if(a === 'start'){ startGame(); }
  else if(a === 'reveal'){ doReveal(); }
  else if(a === 'show'){ G.sh = 1; broadcast(); }
  else if(a === 'next'){ nextRound(); }
  else if(a === 'again'){ toLobby(); }
  else if(a === 'tolobby'){
    if(armLeave === 2){ armLeave = 0; toLobby(); }
    else { armLeave = 2; render(); setTimeout(function(){ armLeave = 0; if(view === 'room') render(); }, 3500); }
  }
  else if(a === 'vote'){
    var v = t.getAttribute('data-pid');
    if(host){ voteFor(myPid, G.rd, v); } else sendVote(v);
  }
});
document.addEventListener('input', function(e){
  if(e.target.id === 'code') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
});

/* ---------- keepalive ---------- */
setInterval(function(){
  if(role === 'client' && conn && conn.open){
    try{ conn.send({t:'p'}); }catch(e){}
    if(lastHost && Date.now() - lastHost > 15000){ try{ conn.close(); }catch(e){} conn = null; scheduleRetry(); }
  }
}, 4000);
setInterval(function(){
  if(role !== 'host' || !G) return;
  var changed = false;
  players.forEach(function(p){
    if(p.pid !== myPid && p.on && Date.now() - (seen[p.pid] || 0) > 15000){ p.on = false; changed = true; var c = conns[p.pid]; delete conns[p.pid]; try{ if(c) c.close(); }catch(e){} }
  });
  if(changed) broadcast();
}, 3000);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible') return;
  try{ if(navigator.wakeLock && role) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){}
  if(role === 'client' && (!conn || !conn.open)) scheduleRetry();
  if(role === 'host' && peer && peer.disconnected){ try{ peer.reconnect(); }catch(e){} }
});
window.__bnb = {get role(){ return role; }, get code(){ return code; }};
render();
})();
</script>
</body>
</html>
